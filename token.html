<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yandex Auth</title>
  <script src="https://yastatic.net/s3/passport-sdk/autofill/v1/sdk-suggest-token-with-polyfills-latest.js"></script>
  <style>
    body { margin: 0; background: #0F1419; color: #E8EEF4; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
  </style>
</head>
<body>
  <p>Авторизация…</p>
  <script>
    // Вспомогательная страница для мгновенной авторизации Яндекс ID
    // Origin основной страницы (без пути!)
    window.onload = function () {
      if (typeof YaSendSuggestToken === 'undefined') {
        document.body.innerHTML = '<p>Ошибка загрузки SDK</p>';
        return;
      }
      YaSendSuggestToken('https://sophia-ritm.github.io', {
        flag: true
      });
    };
  </script>
</body>
</html>
